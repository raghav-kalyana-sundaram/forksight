[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forksight"
version = "1.1.0"
description = "Local chess insights over your own PGN"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ForkSight" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-chess>=1.11",
    "duckdb>=1.1",
    "pyarrow>=17",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
dev = ["pytest>=8"]

[project.scripts]
forksight = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
